<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Kairos</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  /* 生成り地に白カード、藍のアクセント、丸チェック (2026-11-05 ワイド対応で配色を更新。ダークは墨地に同じ藍を明るくしたもの)。デザイン正本は Claude Design「Kairos ワイド画面デザイン」(旧「Tasks PWA デザイン」) */
  :root{--bg:#f5f4f0;--card:#ffffff;--line:#efede7;--sep:#e3e1da;--fg:#1c1b19;--mute:#5f5c55;--mute2:#8c8880;--seg:#eceae3;--segon:#ffffff;--acc:#2f55c8;--accbg:#e8edfb;--over:#b42318;--today:#a86800;--p2:#b45309;--star:#e0a100;--ring:#a8a49b;--shadow:0 1px 2px rgba(28,27,25,.06);--toast:#2c2c2e;--airun:#f1edff;--aiupd:#e8f1ff;--wait:#8e6d00}
  /* テーマ: data-theme が dark なら常にダーク、light なら常にライト、無指定 (auto) は端末設定に追従 */
  :root[data-theme="dark"],:root:not([data-theme="light"]).sys-dark{--bg:#1b1a18;--card:#262522;--line:#33312d;--sep:#3a3833;--fg:#f2f0ea;--mute:#b0aca3;--mute2:#8c8880;--seg:#2c2b28;--segon:#45433e;--acc:#6d8bff;--accbg:#232b47;--over:#ff8a7a;--today:#f0b84b;--p2:#f0a050;--star:#f0b84b;--ring:#6b6862;--shadow:none;--toast:#45433e;--airun:#2b2540;--aiupd:#232b47;--wait:#f0b84b}
  .theme{margin-left:auto;display:flex;align-items:center;gap:8px}
  .theme button{height:34px;min-width:34px;padding:0 8px;border-radius:17px;border:0;background:var(--seg);color:var(--mute);display:flex;align-items:center;justify-content:center;gap:4px}
  .theme button .auto{font-size:11px;font-weight:600;letter-spacing:.3px}
  #undoBtn{font-size:18px;position:relative}
  #undoBtn .n{position:absolute;top:-4px;right:-4px;font-size:10px;font-weight:700;background:var(--acc);color:#fff;border-radius:8px;padding:0 4px;line-height:14px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important} /* .toast 等の display:flex に hidden 属性が負けないように */
  html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  /* タップの手応え (2026-10-15 利用者の報告「タップのレスポンスが悪い」): 押した瞬間に見た目が変わる。遅延なし */
  button:active,.row .card:active,.sheet .list a:active,.meta a:active,.rvc .opts button:active,.rel a:active,.snext button:active,.rpj button:active{opacity:.7;transition:none}
  .tabs button:active,.grid button:active{transform:scale(.97);transition:none}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 20px 12px;display:flex;flex-direction:column;gap:12px}
  .ttl{display:flex;align-items:center;gap:10px}
  .ttl h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px}
  .ttl .date{margin-left:auto;font-size:15px;color:var(--mute)}
  /* タブは 2 段 (2026-10-08): 上段「やる」(今日やる・今日できる・着手中。スマホで は 2026-11-03 に 🔍 絞り込みの 📍 スマホ へ)、下段「整える」(PJ別・役割・見直し・委任)。横スクロールはやめた */
  .tabs{display:flex;flex-direction:column;gap:4px}
  .trow{display:flex;gap:4px;background:var(--seg);padding:3px;border-radius:10px}
  .trow button{flex:1 1 0;min-width:0;padding:7px 4px;border:0;border-radius:8px;background:transparent;color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow.sub{background:transparent;padding:0 3px}
  .trow.sub button{flex:1 1 auto;font-size:12px;padding:4px 4px;color:var(--mute2)} /* 下段は文字幅なり (2026-10-29「クラウドで」を足して 5 つ → 2026-11-03 クラウドで は 🔍 絞り込みの 📍 クラウド に移し、買い物を足して 5 つ) */
  .trow button.on{background:var(--segon);color:var(--fg);box-shadow:var(--shadow)}
  .trow.sub button.on{background:var(--seg);box-shadow:none;color:var(--fg)}
  .trow button .n{margin-left:3px;font-weight:600;color:var(--mute);font-size:11px}
  main{padding:4px 12px 130px;display:flex;flex-direction:column;gap:18px}
  .sec{display:flex;flex-direction:column;gap:6px}
  .sec h2{margin:0;padding:0 10px;font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
  .sec h2.over{color:var(--over)}
  .sec h2.eve{color:#5e5ce6}
  .sec h2.blk{color:var(--mute2)}
  .row.blocked .card{opacity:.45;filter:grayscale(.6)}
  .row.blocked .under{display:none} /* 半透明にするとスワイプの下地が透けるので隠す (2026-09-30) */
  /* 🤖 処理中: 実行中は紫、更新中は青の背景で見分ける (2026-10-03) */
  .row.ai.run .card{background:var(--airun);box-shadow:inset 3px 0 0 #7c5cff}
  .row.ai.upd .card{background:var(--aiupd);box-shadow:inset 3px 0 0 #0a84ff}
  .row.ai.run .aic{color:#7c5cff} .row.ai.run .aic i{background:#7c5cff}
  .row.ai.upd .aic{color:#0a84ff} .row.ai.upd .aic i{background:#0a84ff}
  .go.sess{text-decoration:none;font-size:18px;background:#fff;box-shadow:var(--shadow)}
  .row.ai.run .go.sess{color:#7c5cff} .row.ai.upd .go.sess{color:#0a84ff}
  .sheet .list a.sess{font-weight:600}
  .desc{background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.65;color:var(--fg);box-shadow:var(--shadow)}
  /* 2026-10-23 モバイルの見にくさ対策: 行の途中で切れて字の上半分だけ見えていた → 下端をフェードで消し、トグルは切れた箇所の直下に置く */
  .desc .dtext{word-break:break-word;overflow-wrap:anywhere;max-height:26em;overflow:hidden;position:relative} /* 説明は「なぜ／何を」の2行規約なので原則畳まない。異常に長いときだけ畳む */
  .desc ul,.desc ol{margin:2px 0 2px 1.3em;padding:0}.desc li{margin:1px 0}.desc .dh{font-weight:700;margin-top:4px}.desc .dgap{height:6px}
  .desc code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--seg);border-radius:4px;padding:0 4px}
  .desc a{color:var(--acc);text-decoration:none}
  .desc .dtext.open,.desc .dbody.open{max-height:none}
  .desc .clip{-webkit-mask-image:linear-gradient(#000 calc(100% - 2.4em),transparent);mask-image:linear-gradient(#000 calc(100% - 2.4em),transparent)}
  .desc .dl{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline}
  .desc .dl+.dl{margin-top:8px}
  .desc .dl .dk{margin:0;align-self:start;margin-top:.3em}
  .desc .dbody{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--mute);word-break:break-word;overflow-wrap:anywhere;font-size:13.5px;line-height:1.6;max-height:9.6em;overflow:hidden}
  .desc .tg{display:block;border:0;background:transparent;padding:6px 0 0;color:var(--acc);font-size:13px;font-weight:600;cursor:pointer}
  .desc .more{display:block;margin-top:6px;color:var(--acc);font-size:13px;font-weight:600;text-decoration:none}
  .desc .kv{font-size:12px;color:var(--mute);margin-bottom:6px}
  .desc .dk{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);background:var(--accbg);border-radius:6px;padding:1px 6px;margin-right:4px}
  .meta .aic{color:var(--acc);font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .meta .aic i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:aipulse 1.2s ease-in-out infinite}
  @keyframes aipulse{0%,100%{opacity:.25}50%{opacity:1}}
  .sec h2.aih{color:var(--acc)}
  .sec h2.huh{color:var(--today)}
  .meta .huc{color:var(--today);font-weight:600}
  .row.hu .card{box-shadow:inset 3px 0 0 var(--today)}
  /* 着手中の見やすさ (2026-11-05) */
  .row .nx{margin-top:3px;font-size:12.5px;line-height:1.35;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta .agec{color:var(--mute)}.meta .agec.hot{color:var(--over);font-weight:600}
  .meta .wtc{color:var(--wait)}.meta .parc{color:var(--mute)}.meta .dupc{color:var(--over);font-weight:600}
  .sec h2.huh{text-transform:none;letter-spacing:0} /* 💻 Mac が MAC にならないように */
  .sec h2 .nowc{font-size:11px;font-weight:600;color:var(--acc);text-transform:none;letter-spacing:0;margin-left:4px}
  .wipm{margin:4px 2px 10px;padding:8px 10px;border-radius:10px;background:var(--seg)}
  .wipm .wipt{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:13px}
  .wipm .wipt span{color:var(--mute)}.wipm .wipt small{color:var(--wait);font-size:12px}
  .wipm .wipb{height:5px;margin-top:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .wipm .wipb i{display:block;height:100%;background:var(--acc)}
  .wipm.over b{color:var(--over)}
  /* マス目 (2026-11-05 試作) */
  .grid3{display:grid;grid-template-columns:minmax(92px,1.5fr) repeat(3,1fr) 34px;gap:4px;margin:0 2px 10px;align-items:stretch}
  .grid3 button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .grid3 .gh{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:15px;color:var(--mute);background:none;padding:0 0 2px}
  .grid3 .gh small{font-size:10.5px}
  .grid3 div.gh{font-size:11px}
  .grid3 .gp{text-align:left;padding:8px;border-radius:9px;background:var(--card);color:var(--fg);font-size:13px;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow)}
  .grid3 .gp small{margin-left:auto;font-size:10px;font-weight:700;color:var(--acc)}
  .grid3 .gp.now{box-shadow:inset 3px 0 0 var(--acc),var(--shadow)}
  .grid3 .gc{min-height:38px;border-radius:9px;background:var(--accbg);color:var(--acc);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .grid3 .gc.z{background:none;color:var(--mute2);font-weight:400}
  .grid3 .gt{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mute)}
  .grid3 .sel,.grid3 .gc.sel{background:var(--acc);color:#fff}.grid3 .gp.sel small{color:#fff}
  .gsel{margin:-4px 2px 10px;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:8px}
  .gsel button{font:inherit;border:0;background:var(--seg);color:var(--fg);border-radius:12px;padding:3px 10px;cursor:pointer}.wipm.over .wipb i{background:var(--over)}
  .row.blocked .ring{border-style:dashed;cursor:default}
  .row.blocked .name{color:var(--mute)}
  .grid button:disabled{opacity:.35;pointer-events:none}
  .meta .blkc{color:#5e5ce6;font-weight:600}
  .chain{background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .chain .ch{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:15px}
  .chain .ch+.ch{border-top:1px solid var(--line)}
  .chain .ch .no{width:22px;height:22px;border-radius:11px;background:var(--seg);color:var(--mute);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .chain .ch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chain .ch .nm small{display:block;font-size:12px;color:var(--mute)}
  .chain .ch a{color:var(--acc);font-size:13px;text-decoration:none;flex:none}
  .sheet .sect{margin:2px 6px 0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.2px}
  .sec h2.prjh{text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);display:flex;align-items:center;gap:6px}
  .sec h2 .n{font-size:12px;font-weight:600;color:var(--mute);background:var(--seg);padding:0 7px;border-radius:9px}
  .trow button{font-size:12px}
  .group{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .row{position:relative;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 66px} /* 画面外の行はレイアウトしない (2026-10-07 キビキビ対応) */
  .row+.row .card{border-top:1px solid var(--line)}
  .row .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;color:#fff}
  .row .card{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);transition:transform .15s;touch-action:pan-y}
  .ring{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ring);flex:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
  button.ring{position:relative}
  button.ring::before{content:"";position:absolute;inset:-12px} /* 当たり判定を 44px に広げる */
  button.ring.on{background:var(--acc);border-color:var(--acc)}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .name{font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:12px;color:var(--mute)}
  .meta>span{white-space:nowrap}
  .meta .over{color:var(--over);font-weight:600}.meta .today{color:var(--today);font-weight:600}
  .meta .p1{color:var(--over);font-weight:600}.meta .p2{color:var(--p2);font-weight:600}
  .meta .prj{color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .go{flex:none;width:36px;height:36px;border-radius:18px;border:0;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center}
  .empty{padding:56px 20px;text-align:center;color:var(--mute2)}
  .hint{font-size:12px;color:var(--mute2);text-align:center;padding-top:4px}
  /* いまの状況チップ (2026-10-12): 場所・道具・時間帯。タブは増やさず、ここ 1 つで一覧の並びを変える */
  .sitbar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:2px}
  .sitbar button[hidden]{display:none}
  .sitbar button{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:0;border-radius:999px;background:var(--seg);color:var(--fg);font-size:12px;font-weight:600}
  .sitbar button small{font-weight:500;color:var(--mute)}
  .sitbar button.manual{background:var(--accbg);color:var(--acc)}
  /* 🔍 絞り込み (2026-11-03): ラベル・コンテキスト・種類。ヘッダーにはボタン 1 つだけ置き、選ぶのはシートで */
  .sitbar #fltChip.on{background:var(--acc);color:#fff}
  .sitbar #fltChip .x{margin-left:2px;padding:0 2px;font-weight:700}
  .sheet .grid.flt{grid-template-columns:repeat(3,1fr);gap:6px}
  .sheet .grid.flt button{padding:9px 6px;font-size:13px;gap:4px;flex-wrap:wrap;line-height:1.25}
  .sheet .grid.flt button small{font-weight:500;opacity:.75}
  .sheet .grid.flt button.on{background:var(--acc);color:#fff}
  .sheet .grid.flt button.later{opacity:.45}
  .sheet .sect select{margin-left:6px;min-height:30px;padding:3px 8px;border:1px solid var(--sep);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;font-size:12px}
  .sheet .grid.sit button.on{background:var(--acc);color:#fff}
  .sec h2.unav{color:var(--mute2)}
  .stale{font-size:12px;color:var(--p2);text-align:center}
  .stale.wip{color:var(--over)}
  /* 2026-10-21 更新中のちらつき対策: 「更新中…」の行は高さを増減させて一覧を押し下げていた。ヘッダー下端の細い線に替え、0.5 秒以上かかったときだけ出す (レイアウトを動かさない) */
  .busy{position:absolute;left:0;right:0;bottom:0;height:2px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .15s}
  .busy.on{opacity:1}
  .busy::before{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:var(--p2);animation:busy 1s ease-in-out infinite}
  @keyframes busy{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  /* 画面外の節は描画を後回しにする (lazy render)。長い一覧 (PJ 別など) の切り替えが軽くなる */
  .sec{content-visibility:auto;contain-intrinsic-size:auto 280px}
  /* ⭐ 今日の3つ (MIT, 2026-10-06) */
  .sec h2.mith{color:var(--star)}
  .sec h2.mrh{color:#c47a1a}
  .row.mit .card{box-shadow:inset 3px 0 0 var(--star)}
  .meta .mitc{color:var(--star)}
  .meta .wfc{color:var(--mute)}
  .meta .cry{color:var(--p2)} .meta .cry.hot{color:var(--over)}
  /* 検索 (2026-10-04): 🔍 でタブの代わりに検索欄を出す。全未完了を名前・説明で引く */
  .srch{display:flex;gap:8px;align-items:center}
  .srch input{flex:1;font-size:16px;padding:9px 14px;border-radius:12px;border:0;background:var(--card);color:var(--fg);box-shadow:var(--shadow);min-width:0}
  .srch label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute);white-space:nowrap}
  .srch button{height:34px;min-width:34px;border-radius:17px;border:0;background:var(--seg);color:var(--mute);font-size:16px}
  /* 📁 PJ別の見出し (Phase B-7/8, 2026-10-06): ゴール／完了条件／進捗バー。クローズ候補は黄、止まっている PJ は赤 */
  .pjh{padding:4px 10px 2px;display:flex;flex-direction:column;gap:6px}
  .pjh.cl{padding:10px 12px;border-radius:12px;background:#fff7e6;border:1px solid #f3dca8;gap:8px}
  :root[data-theme="dark"] .pjh.cl,:root:not([data-theme="light"]).sys-dark .pjh.cl{background:#3a2f12;border-color:#5a4a1e}
  .pjh .pt{display:flex;align-items:center;gap:8px}
  .pjh .pn{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pjh .pr{font-size:12px;color:var(--mute);flex:none}
  .pjh .bdg{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}
  .pjh .bdg.cl{color:#8a5a00;background:#ffe6b3}
  .pjh .bdg.st{color:#b23b32;background:#fde7e5}
  .pjh .pg{font-size:12px;color:var(--mute);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pjh .pg.warn{color:var(--over);white-space:normal}
  .pjh .pb{display:flex;align-items:center;gap:8px}
  .pjh .bar{flex:1;height:6px;border-radius:3px;background:var(--sep);overflow:hidden}
  .pjh.cl .bar{background:#ead9b0}
  .pjh .bar i{display:block;height:100%;background:var(--acc)}
  .pjh .bar i.full{background:#34a853}
  .pjh .pc{font-size:12px;color:var(--mute);font-weight:600;flex:none}
  .pjh .pbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pjh .pbtn button{padding:11px;border:0;border-radius:10px;background:var(--card);color:var(--fg);font-size:14px;font-weight:600}
  .pjh .pbtn button.pri{background:var(--acc);color:#fff}
  .pjh .pbtn a{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:10px;background:var(--card);color:var(--fg);font-size:14px;font-weight:600;text-decoration:none}
  .pjh .pbtn.row{margin-top:2px}
  .pjh .fn{font-size:11px;color:var(--mute)}
  .pjh .n{font-size:12px;font-weight:600;color:var(--mute);background:var(--seg);padding:0 7px;border-radius:9px;flex:none}

  const cacheSig = new Map();

  // ---- 操作 ----

    const items = (r.candidates || []).map((c) => `<button data-pick="${c.id}"><span class="nm">${c.icon ? c.icon + " " : ""}${esc(c.name)}</span><small>${c.due ? fmtDate(c.due) : (c.project ? esc(c.project).slice(0, 12) : "")}</small></button>`).join("");
    $("#sheet").innerHTML = `<div class="grab"></div><div class="head"><h3>${r.icon ? r.icon + " " : ""}${esc(r.name)} — 今週の石を置く</h3><button class="close" aria-label="閉じる">✕</button></div>
      <div class="sub">予定に入れないと起きないもの。この役割の PJ の未完了から 1 つ</div>
      <div class="list pick">${items || '<button disabled><span class="nm" style="color:var(--mute)">候補なし（この役割の PJ に未完了タスクがありません）</span></button>'}</div>
      <a class="notion" href="${claudeLink(`役割「${r.name}」の今週の石（今週の目標）を一問一答で決めたいです。Kairos 🧭 Roles のページ: ${r.url} 。候補を 3 つ出して 1 つに絞り、✅ Tasks に無ければ起票して、今週の目標 に「〜M/D：<タスク名> → Tasks <page_id>」の書式で書いてください。`)}" data-ext>${aiIcon()} ${aiName()} と相談して決める</a>`;
    $("#sheetWrap").hidden = false; $("#sheet").style.transform = ""; $("#sheet").scrollTop = 0; sheetStep = null; if (!history.state || !history.state.sheet) history.pushState({ sheet: true }, "");
    $("#sheet").querySelector(".close").onclick = closeSheet;
    $("#sheet").querySelectorAll("[data-pick]").forEach((b) => b.onclick = async () => {
      closeSheet();
      try { await api(`/api/roles/${r.id}/goal`, { method: "POST", body: JSON.stringify({ taskId: b.dataset.pick }) }); toast(`今週の石: ${b.querySelector(".nm").textContent}`); load("roles", { silent: true }); }
      catch (e) { toast("失敗: " + e.message); }
    });
  }
  function openStoneSheet(r) {
    const st = r.stone; const t = st.taskId ? { id: st.taskId, name: st.name, url: st.url || ("https://www.notion.so/" + st.taskId.replace(/-/g, "")) } : null;
    $("#sheet").innerHTML = `<div class="grab"></div><div class="head"><h3>${st.icon ? st.icon + " " : ""}${esc(st.name)}</h3><button class="close" aria-label="閉じる">✕</button></div>
      <div class="sub">${esc(r.name)} の今週の石${st.until ? `（〜${esc(st.until)}）` : ""}${st.due ? ` · 期日 ${fmtDate(st.due)}` : ""}</div>
      <div class="list">${t ? `<a href="${aiHref(t, "run")}" data-stoneai><span class="ic">${aiIcon()}</span>🤖 ${aiName()} に進めてもらう</a><a href="${t.url}" target="_blank" rel="noopener"><span class="ic">📄</span>Kairos で開く</a>` : ""}
        <a href="#" data-repick><span class="ic">${ICONS.pen}</span>別のタスクに置き換える</a><a href="#" data-unstone style="color:var(--mute)"><span class="ic">${ICONS.skip}</span>石を外す</a></div>`;
    $("#sheetWrap").hidden = false; $("#sheet").style.transform = ""; $("#sheet").scrollTop = 0; sheetStep = null; if (!history.state || !history.state.sheet) history.pushState({ sheet: true }, "");
    $("#sheet").querySelector(".close").onclick = closeSheet;
    $("#sheet").querySelector("[data-repick]").onclick = (e) => { e.preventDefault(); closeSheet(); setTimeout(() => openPickSheet(r), 200); };
    $("#sheet").querySelector("[data-unstone]").onclick = async (e) => { e.preventDefault(); closeSheet(); try { await api(`/api/roles/${r.id}/goal`, { method: "POST", body: JSON.stringify({}) }); toast("石を外した: " + r.name); load("roles", { silent: true }); } catch (err) { toast("失敗: " + err.message); } };
    const ai = $("#sheet").querySelector("[data-stoneai]"); if (ai) ai.onclick = () => { closeSheet(); apiFetch(`/api/tasks/${t.id}/ai?mode=run&${aiLaunchQs()}`, { method: "POST", keepalive: true }).catch(() => {}); };
  }
  $("#list").addEventListener("click", (e) => {
    if (swiping) return;
    // 🔁 習慣 (2026-11-05): 記録・詳細・習慣タブへ。今日やるの帯と習慣タブの両方から
    const hlg = e.target.closest("[data-hlog]"); if (hlg) { logHabit(hlg.dataset.hlog, hlg); return; }
    const hid = e.target.closest("[data-hid]"); if (hid) { const hh = habitsData && habitsData.habits.find((x) => x.id === hid.dataset.hid); if (hh) openHabitSheet(hh); return; }
    const gv = e.target.closest("[data-goview]"); if (gv) { load(gv.dataset.goview); return; }
    // マス目 (2026-11-05): 同じマスをもう一度押すと外す
    const gc = e.target.closest("[data-cell]");
    if (gc) { const [place, col] = gc.dataset.cell.split("|"); const nx = { place: place || null, col: col || null }; doingCell = doingCell && doingCell.place === nx.place && doingCell.col === nx.col ? null : nx; lastSig = ""; render(todayStr); return; }
    if (e.target.closest("[data-cell-clear]")) { doingCell = null; lastSig = ""; render(todayStr); return; }
    const pc = e.target.closest("[data-pjclose]"); if (pc) { closeProject(pc.dataset.pjclose, pc.dataset.pjname); return; }
    const ps = e.target.closest("[data-pjsel]"); if (ps) { pjSel = ps.dataset.pjsel; lastSig = ""; render(todayStr); const d = $(".pjd"); if (d) d.scrollIntoView({ block: "nearest" }); return; }
    const pd = e.target.closest("[data-pjdeps]"); if (pd) { openDeps(pd.dataset.pjdeps); return; }
    if (e.target.closest("[data-quad]")) { e.preventDefault(); openQuad(); return; }
    if (view === "graph") {
      if (e.target.closest("[data-dback]")) { graphData = null; load(depsBack); return; }
      const gd = e.target.closest("[data-gdeps]"); if (gd) { openDeps(gd.dataset.gdeps); return; }
      if (e.target.closest("a")) return;
      const nd = e.target.closest("[data-gid]"); if (nd) { const t = tasks.find((x) => x.id === nd.dataset.gid); if (t) { if (t.id === graphData.task.id) openSheet(t, todayStr); else openGraph(t.id); } }
      return;
    }
    if (view === "shop") { // 🛒 行をタップでシート
      const sr = e.target.closest(".srow[data-id]"); if (sr) { const t = tasks.find((x) => x.id === sr.dataset.id); if (t) openSheet(t, todayStr); }
      return;
    }
    if (view === "quad") {
      if (e.target.closest("[data-dback]")) { load(depsBack); return; }
      const qi = e.target.closest("[data-qid]"); if (qi) { const t = tasks.find((x) => x.id === qi.dataset.qid); if (t) openSheet(t, todayStr); }
      return;
    }
    if (view === "deps") {
      if (e.target.closest("[data-dback]")) { closeDeps(); return; }
      if (e.target.closest("[data-dtoggle]")) { depsShowDone = !depsShowDone; render(todayStr); return; }
      const fx = e.target.closest("[data-fix]"); if (fx) { fixConflict(fx.dataset.fix, fx.dataset.date); return; }
      if (e.target.closest("a")) return;
      const nm = e.target.closest("[data-did]"); const t = nm && tasks.find((x) => x.id === nm.dataset.did); if (t) openSheet(t, todayStr);
      return;
    }
    const pa = e.target.closest("[data-pjadd]"); if (pa) { setAddProject({ id: pa.dataset.pjadd, label: pa.dataset.pjlabel }); return; }
    if (view === "review") {
      if (e.target.closest("[data-ext]") || e.target.closest("a")) return;
      // 「このあと」の問いをタップ＝その問いを先頭に (2026-10-10 利用者の提案「どれからスタートするか選べるように」)
      const pk = e.target.closest("[data-rvpick]"); if (pk && reviewData) { reviewForce.add(pk.dataset.rvpick); reviewKind = null; const i = reviewData.questions.findIndex((n) => n.id + n.kind === pk.dataset.rvpick); if (i >= 0) { const [x] = reviewData.questions.splice(i, 1); reviewData.questions.unshift(x); render(todayStr); window.scrollTo({ top: 0, behavior: "smooth" }); } return; }
      if (e.target.closest("[data-rvmore]")) { reviewShowAll = true; render(todayStr); return; }
      const kc = e.target.closest(".kchips [data-kind]"); if (kc) { const k = kc.dataset.kind; if (k && reviewLater.has(k)) reviewLater.delete(k); reviewKind = k || null; render(todayStr); return; } // 種類チップ: 絞る／後回しを戻す
      const lt = e.target.closest("[data-later]"); if (lt) { e.preventDefault(); reviewLater.add(lt.dataset.later); if (reviewKind === lt.dataset.later) reviewKind = null; render(todayStr); toast(`${(KIND[lt.dataset.later] || {}).t || ""} は後回し（チップで戻せる）`); return; }
      const b = e.target.closest("[data-ans]"); if (!b) return;
      if (reviewStale) { toast("最新の問いを読み込み中です。少し待ってから答えてください"); return; }
      const card = b.closest(".rvc"); const q = card && reviewData && reviewData.questions.find((x) => x.id === card.dataset.qid && x.kind === card.dataset.kind);
      if (q) reviewAnswer(q, b.dataset.ans);
      return;
    }
    if (view === "roles") {
      if (e.target.closest("[data-ext]")) return; // Claude へのリンクはそのまま
      const rc = e.target.closest("[data-role]"); const r = rc && rolesData && rolesData.roles.find((x) => x.id === rc.dataset.role); if (!r) return;
      if (e.target.closest("[data-rolepick]")) openPickSheet(r);
      else if (e.target.closest("[data-rolestone]")) openStoneSheet(r);
      else if (e.target.closest("[data-rolepj]")) { if (rolePjOpen.has(r.id)) rolePjOpen.delete(r.id); else rolePjOpen.add(r.id); rc.querySelector(".rpj").classList.toggle("open", rolePjOpen.has(r.id)); }
      else if (e.target.closest("[data-rpj]")) { const b = e.target.closest("[data-rpj]"); const p = (r.projects || []).find((x) => x.id === b.dataset.rpj); if (p && p.open > 1) openDeps(p.id); else { load("project"); } }
      return;
    }
    const row = e.target.closest(".row"); if (!row) return;
    const t = tasks.find((x) => x.id === row.dataset.id); if (!t) return;
    if (e.target.closest("[data-sess]")) return; // 処理中のセッションを開くリンク。シートは開かない
    if (e.target.closest("[data-claude]")) { if (t.blocked) { openSheet(t, todayStr); return; } goClaude(t, aiHref(t, "run")); return; } // 先行待ちはチェーン込みで投げたいのでメニューへ
    if (e.target.closest("[data-fdefer]")) { act(t, "defer?days=1", "明日へ"); return; } // いまの1つ の 明日へ
    if (e.target.closest("[data-fnext]")) { focusSkip.add(t.id); lastSig = ""; render(todayStr); return; } // いまの1つ を後回しにして次へ
    const ring = e.target.closest("[data-done]");
    if (ring) { // 丸をタップ＝完了 (青く塗ってから消す)
      if (t.aiActive && !confirm("AI が処理中です。それでも完了にしますか？")) return;
      ring.classList.add("on"); ring.innerHTML = ICONS.check;
      setTimeout(() => act(t, "done", "完了"), 180);
      return;
    }
    openSheet(t, todayStr);
  });
  // ---- 右クリックメニュー (2026-11-03) ----
  // 一覧の行を右クリック (Mac)・長押し (Android) で、シートを開かずに主な操作を選ぶ。項目はシートの操作のうち使われているものだけ
  // (選定の根拠は docs/design-notes.md)。中身は data-m のキー列。シートと同じ act() を通すので ↩ 取り消しもそのまま効く
  // dg = 委任先の先頭 (担当 の選択肢の 1 番目。委任の 9 割がここ)
  function cmenuItems(t, dg) {
    if (t.done) return [{ m: "reopen", ic: "↩", t: "未完了に戻す" }, "-", { m: "open", ic: "☰", t: "詳細を開く" }];
    const b = !!t.blocked;
    return [
      { m: "done", ic: "✓", t: "完了", off: b },
      { m: "ai", ic: "🤖", t: "AI に進めてもらう" },
      { m: "ai-update", ic: "✎", t: "AI にタスク内容を更新してもらう" }, // シートの「タスク内容を更新してもらう」(AI処理種別=更新)。先行待ちでも押せる
      t.aiSession ? { m: "ai-update-fresh", ic: "✨", t: "新しいチャットでタスク内容を更新してもらう" } : null, // 前回のセッションがあるときだけ。シートの ✨ と同じ (2026-11-05)
      "-",
      t.mit ? { m: "mit-clear", ic: "⭐", t: "今日の3つから外す" } : { m: "mit", ic: "⭐", t: "今日の3つに入れる", off: b },
      { m: "defer?days=1", ic: "→", t: "明日へ", off: b },
      { m: "defer?to=weekend", ic: "📅", t: "週末に", off: b },
      { m: "defer?to=nextweek", ic: "📅", t: "来週に", off: b },
      "-",
      t.owner ? { m: "delegate?to=", ic: "👥", t: "自分に戻す" } : dg ? { m: "delegate?to=" + encodeURIComponent(dg), ic: "👥", t: dg + " に委任" } : null,
      { m: "skip", ic: "⤼", t: "見送りで完了", off: b, mute: true },
      { m: "open", ic: "☰", t: "詳細を開く" },
    ].filter(Boolean);
  }
  // ---- end 右クリックメニュー ----
  let cmTask = null;
  function closeCmenu() { const m = $("#cmenu"); if (m.hidden) return; m.hidden = true; cmTask = null; }
  function openCmenu(t, x, y) {
    cmTask = t;
    const m = $("#cmenu");
    m.innerHTML = `<div class="cmh">${t.icon ? t.icon + " " : ""}${esc(t.name)}</div>` + cmenuItems(t, DELEGATES[0]).map((it) => it === "-" ? "<hr>"
      : `<button type="button" role="menuitem" data-m="${it.m}"${it.mute ? ' class="mute"' : ""}${it.off ? " disabled" : ""}><span class="ci">${it.ic}</span>${it.m === "ai" ? `${esc(aiName())} に進めてもらう` : it.m === "ai-update" ? `${esc(aiName())} にタスク内容を更新してもらう` : it.m === "ai-update-fresh" ? `${esc(aiName())} に新しいチャットで更新してもらう` : it.t}</button>`).join("");
    m.hidden = false;
    // 画面からはみ出さないように寄せる (幅 400px の端末でも収まる)
    const W = innerWidth, H = innerHeight, r = m.getBoundingClientRect();
    m.style.left = Math.max(8, Math.min(x, W - r.width - 8)) + "px";
    m.style.top = Math.max(8, Math.min(y, H - r.height - 8)) + "px";
    const first = m.querySelector("button:not(:disabled)"); if (first) first.focus({ preventScroll: true });
  }
  $("#list").addEventListener("contextmenu", (e) => {
    const row = e.target.closest(".row[data-id], .srow[data-id]"); if (!row) return;
    if (e.target.closest("a[href]") && !e.target.closest(".card")) return; // リンクの右クリックはブラウザ既定 (新しいタブで開く 等) を残す
    const t = tasks.find((x) => x.id === row.dataset.id); if (!t) return;
    e.preventDefault();
    if (card) { card.style.transform = ""; card = null; } // 長押しの最中に始まっていたスワイプは捨てる
    let x = e.clientX, y = e.clientY;
    if (!x && !y) { const r = row.getBoundingClientRect(); x = r.left + 24; y = r.bottom - 4; } // キーボード (Shift+F10・メニューキー) から
    openCmenu(t, x, y);
  });
  $("#cmenu").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-m]"); if (!b || b.disabled || !cmTask) return;
    const t = cmTask, m = b.dataset.m; closeCmenu();
    if (m === "open") { openSheet(t, todayStr); return; }
    if (m === "ai-update") { goClaude(t, aiHref(t, "update"), "update"); return; } // 期日・実行環境・説明・サブタスク分割の見直しを AI に頼む
    if (m === "ai-update-fresh") { goClaude(t, claudeHref(t, "update"), "update", true); return; } // 前回のセッションを使わず新しいチャットで
    if (m === "ai") { if (t.blocked) { openSheet(t, todayStr); return; } goClaude(t, aiHref(t, "run")); return; } // 先行待ちはチェーン込みで投げたいのでシートへ (行の 🤖 と同じ)
    if ((m === "done" || m === "skip") && t.aiActive && !confirm("AI が処理中です。それでも完了にしますか？")) return;
    const it = cmenuItems(t, DELEGATES[0]).find((x) => x.m === m);
    act(t, m, it ? it.t : m, m === "mit" || m === "mit-clear"); // ⭐ は一覧に残したまま節を移す。委任は行を消して取り直しで正しいタブへ (シートと同じ)
  });
  document.addEventListener("pointerdown", (e) => { if (!e.target.closest("#cmenu")) closeCmenu(); }, true);
  document.addEventListener("keydown", (e) => {
    const m = $("#cmenu"); if (m.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeCmenu(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { // ↑↓ で項目を移る
      e.preventDefault();
      const bs = [...m.querySelectorAll("button:not(:disabled)")], i = bs.indexOf(document.activeElement);
      const n = bs[(i + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length]; if (n) n.focus();
    }
  }, true);
  window.addEventListener("scroll", closeCmenu, { passive: true });
  window.addEventListener("resize", closeCmenu);
  window.addEventListener("blur", closeCmenu);
  const _render = render; render = (today) => { todayStr = today; _render(today); };
  $("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) load(b.dataset.v); };
  $("#sitChip").onclick = openSitPick;
  $("#fltChip").onclick = (e) => { if (e.target.closest("[data-fx]")) { filt = {}; saveFilt(); refreshTabCounts(); lastSig = ""; render(todayStr); return; } openFilterPick(); };
  // 検索 (2026-10-04): 🔍 で検索欄を出し、入力が止まって 350ms で引く。✕ か空 Esc で元のタブへ
  function openSearch() {
    if (view !== "search") { searchBack = view; view = "search"; }
    tasks = []; render(todayStr); $("#srchQ").focus();
    if (searchQ.trim()) load("search");
  }
  function closeSearch() { if (view !== "search") return; searchQ = ""; $("#srchQ").value = ""; load(searchBack); }
  $("#srchBtn").onclick = () => view === "search" ? closeSearch() : openSearch();
  $("#srchClose").onclick = closeSearch;
  let srchTimer = null;
  $("#srchQ").addEventListener("input", () => { searchQ = $("#srchQ").value; clearTimeout(srchTimer); srchTimer = setTimeout(() => load("search"), 350); });
  $("#srchQ").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); closeSearch(); } });
  $("#srch").onsubmit = (e) => { e.preventDefault(); clearTimeout(srchTimer); searchQ = $("#srchQ").value; load("search"); $("#srchQ").blur(); };
  $("#srchAll").onchange = () => { searchAll = $("#srchAll").checked; load("search"); };
  document.addEventListener("keydown", (e) => { // Mac: ⌘F / Ctrl+F で検索
    if ((e.metaKey || e.ctrlKey) && e.key === "f" && $("#sheetWrap").hidden) { e.preventDefault(); openSearch(); }
  });
  $("#add").onsubmit = async (e) => {
    e.preventDefault(); const name = $("#addName").value.trim(); if (!name) return; $("#addName").value = "";
    const pj = addProject; // PJ別の「この PJ にタスクを足す」から来たときは紐づける (Phase B)
    try {
      // 実行環境の既定は「いまの状況」(2026-10-13): 端末 (Mac か スマホ) ＋ 場所。シートの「できる状況」で直せる
      const S = currentSit(); const envTags = [isMac ? "Mac" : PHONE_ENV, S.place];
      const j = await api("/api/tasks", { method: "POST", body: JSON.stringify({ name, env: envTags, ...(pj ? { projectId: pj.id } : {}) }) });
      // PJ に他の未完了があれば、その場で先行を選べるボタンを出す (2026-10-07, 依存の洗い出し D)
      const pjInfo = pj && (projInfo || []).find((p) => p.id === pj.id);
      if (pj && pjInfo && pjInfo.open > 0) toast(`追加: ${j.task.name} → ${j.task.project || pjInfo.label}`, () => openPredPick(j.task), "先行を選ぶ");
      else toast("追加: " + j.task.name + (j.task.project ? ` → ${j.task.project}` : "") + `（${envTags.map((x) => TOOL_LABEL[x] || x).join("・")}）`);
      if (pj) { setAddProject(null); projInfoAt = 0; } load(view, { silent: true });
    }
    catch (err) { toast("追加失敗: " + err.message); $("#addName").value = name; }
  };

  // 新しい版の SW が引き継いだら 1 回だけ読み込み直す (デプロイ後に古い画面を残さない)。初回インストールでは読み込み直さない
  if ("serviceWorker" in navigator) {
    let swCtl = navigator.serviceWorker.controller, swReloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { const prev = swCtl; swCtl = navigator.serviceWorker.controller; if (!prev || swReloading) return; swReloading = true; location.reload(); });
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
  if (window.KAIROS_PREVIEW) { const banner = document.createElement("div"); banner.textContent = "D1プレビュー（読み取り専用）"; banner.style.cssText = "padding:8px;text-align:center;background:#fff3cd;color:#664d03"; document.body.prepend(banner); }
  load(view).then(() => { counts(); if (view !== "review") setTimeout(() => fetchReview(), 1500); const id = new URL(location.href).searchParams.get("page"); if (/^[a-f0-9]{32}$/.test(id || "")) openReader(id); });
})();
</script>
