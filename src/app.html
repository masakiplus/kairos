<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Kairos</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  /* Things 風: 淡いグレー地に白カード、青アクセント、丸チェック。デザイン正本は Claude Design「Tasks PWA デザイン」 */
  :root{--bg:#f5f5f7;--card:#ffffff;--line:#f0f0f2;--sep:#e5e5ea;--fg:#1d1d1f;--mute:#8e8e93;--mute2:#aeaeb2;--seg:#e9e9ee;--segon:#ffffff;--acc:#2f7cf6;--accbg:#eef3ff;--over:#d0342c;--today:#e0a100;--p2:#e8871e;--star:#f7c948;--ring:#c7c7cc;--shadow:0 1px 2px rgba(0,0,0,.05);--toast:#2c2c2e;--airun:#f1edff;--aiupd:#e8f1ff}
  /* テーマ: data-theme が dark なら常にダーク、light なら常にライト、無指定 (auto) は端末設定に追従 */
  :root[data-theme="dark"],:root:not([data-theme="light"]).sys-dark{--bg:#1c1c1e;--card:#2c2c2e;--line:#3a3a3c;--sep:#3a3a3c;--fg:#f2f2f7;--mute:#aeaeb2;--mute2:#8e8e93;--seg:#2c2c2e;--segon:#48484a;--acc:#4c8dff;--accbg:#1f2f4d;--over:#ff6b5e;--today:#f7c948;--p2:#ff9f3c;--ring:#636366;--shadow:none;--toast:#48484a;--airun:#2d2548;--aiupd:#1f2f4d}
  .theme{margin-left:auto;display:flex;align-items:center;gap:8px}
  .theme button{height:34px;min-width:34px;padding:0 8px;border-radius:17px;border:0;background:var(--seg);color:var(--mute);display:flex;align-items:center;justify-content:center;gap:4px}
  .theme button .auto{font-size:11px;font-weight:600;letter-spacing:.3px}
  #undoBtn{font-size:18px;position:relative}
  #undoBtn .n{position:absolute;top:-4px;right:-4px;font-size:10px;font-weight:700;background:var(--acc);color:#fff;border-radius:8px;padding:0 4px;line-height:14px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important} /* .toast 等の display:flex に hidden 属性が負けないように */
  html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"SF Pro Text","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 20px 12px;display:flex;flex-direction:column;gap:12px}
  .ttl{display:flex;align-items:center;gap:10px}
  .ttl h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px}
  .ttl .date{margin-left:auto;font-size:15px;color:var(--mute)}
  /* タブは 2 段 (2026-10-08): 上段「やる」(今日やる・今日できる・スマホで・着手中)、下段「整える」(PJ別・役割・見直し・委任)。横スクロールはやめた */
  .tabs{display:flex;flex-direction:column;gap:4px}
  .trow{display:flex;gap:4px;background:var(--seg);padding:3px;border-radius:10px}
  .trow button{flex:1 1 0;min-width:0;padding:7px 4px;border:0;border-radius:8px;background:transparent;color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow.sub{background:transparent;padding:0 3px}
  .trow.sub button{font-size:12px;padding:4px 4px;color:var(--mute2)}
  .trow button.on{background:var(--segon);color:var(--fg);box-shadow:var(--shadow)}
  .trow.sub button.on{background:var(--seg);box-shadow:none;color:var(--fg)}
  .trow button .n{margin-left:3px;font-weight:600;color:var(--mute);font-size:11px}
  main{padding:4px 12px 130px;display:flex;flex-direction:column;gap:18px}
  .sec{display:flex;flex-direction:column;gap:6px}
  .sec h2{margin:0;padding:0 10px;font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
  .sec h2.over{color:var(--over)}
  .sec h2.eve{color:#5e5ce6}
  .sec h2.blk{color:var(--mute2)}
  .row.blocked .card{opacity:.45;filter:grayscale(.6)}
  .row.blocked .under{display:none} /* 半透明にするとスワイプの下地が透けるので隠す (2026-09-30) */
  /* 🤖 処理中: 実行中は紫、更新中は青の背景で見分ける (2026-10-03) */
  .row.ai.run .card{background:var(--airun);box-shadow:inset 3px 0 0 #7c5cff}
  .row.ai.upd .card{background:var(--aiupd);box-shadow:inset 3px 0 0 #0a84ff}
  .row.ai.run .aic{color:#7c5cff} .row.ai.run .aic i{background:#7c5cff}
  .row.ai.upd .aic{color:#0a84ff} .row.ai.upd .aic i{background:#0a84ff}
  .go.sess{text-decoration:none;font-size:18px;background:#fff;box-shadow:var(--shadow)}
  .row.ai.run .go.sess{color:#7c5cff} .row.ai.upd .go.sess{color:#0a84ff}
  .sheet .list a.sess{font-weight:600}
  .desc{background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;color:var(--fg);box-shadow:var(--shadow)}
  .desc .dtext{white-space:pre-wrap;word-break:break-word;max-height:9.5em;overflow:hidden;position:relative}
  .desc .dtext.open{max-height:none}
  .desc .dbody{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--mute);white-space:pre-wrap;word-break:break-word;font-size:13px;max-height:12em;overflow:hidden}
  .desc .dbody.open{max-height:none}
  .desc .more{display:block;margin-top:6px;color:var(--acc);font-size:13px;font-weight:600;text-decoration:none}
  .desc .kv{font-size:12px;color:var(--mute);margin-bottom:6px}
  .desc .dk{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);background:var(--accbg);border-radius:6px;padding:1px 6px;margin-right:4px}
  .meta .aic{color:var(--acc);font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .meta .aic i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:aipulse 1.2s ease-in-out infinite}
  @keyframes aipulse{0%,100%{opacity:.25}50%{opacity:1}}
  .sec h2.aih{color:var(--acc)}
  .sec h2.huh{color:var(--today)}
  .meta .huc{color:var(--today);font-weight:600}
  .row.hu .card{box-shadow:inset 3px 0 0 var(--today)}
  .row.blocked .ring{border-style:dashed;cursor:default}
  .row.blocked .name{color:var(--mute)}
  .grid button:disabled{opacity:.35;pointer-events:none}
  .meta .blkc{color:#5e5ce6;font-weight:600}
  .chain{background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .chain .ch{display:flex;align-items:center;gap:10px;padding:11px 12px;font-size:15px}
  .chain .ch+.ch{border-top:1px solid var(--line)}
  .chain .ch .no{width:22px;height:22px;border-radius:11px;background:var(--seg);color:var(--mute);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .chain .ch .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chain .ch .nm small{display:block;font-size:12px;color:var(--mute)}
  .chain .ch a{color:var(--acc);font-size:13px;text-decoration:none;flex:none}
  .sheet .sect{margin:2px 6px 0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.2px}
  .sec h2.prjh{text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);display:flex;align-items:center;gap:6px}
  .sec h2 .n{font-size:12px;font-weight:600;color:var(--mute);background:var(--seg);padding:0 7px;border-radius:9px}
  .trow button{font-size:12px}
  .group{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .row{position:relative;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 66px} /* 画面外の行はレイアウトしない (2026-10-07 キビキビ対応) */
  .row+.row .card{border-top:1px solid var(--line)}
  .row .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;color:#fff}
  .row .card{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);transition:transform .15s;touch-action:pan-y}
  .ring{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ring);flex:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
  button.ring{position:relative}
  button.ring::before{content:"";position:absolute;inset:-12px} /* 当たり判定を 44px に広げる */
  button.ring.on{background:var(--acc);border-color:var(--acc)}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .name{font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{display:flex;flex-wrap:wrap;gap:3px 8px;font-size:12px;color:var(--mute)}
  .meta>span{white-space:nowrap}
  .meta .over{color:var(--over);font-weight:600}.meta .today{color:var(--today);font-weight:600}
  .meta .p1{color:var(--over);font-weight:600}.meta .p2{color:var(--p2);font-weight:600}
  .meta .prj{color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .go{flex:none;width:36px;height:36px;border-radius:18px;border:0;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center}
  .empty{padding:56px 20px;text-align:center;color:var(--mute2)}
  .hint{font-size:12px;color:var(--mute2);text-align:center;padding-top:4px}
  .stale{font-size:12px;color:var(--p2);text-align:center}
  .stale.wip{color:var(--over)}
  /* ⭐ 今日の3つ (MIT, 2026-10-06) */
  .sec h2.mith{color:var(--star)}
  .row.mit .card{box-shadow:inset 3px 0 0 var(--star)}
  .meta .mitc{color:var(--star)}
  .meta .wfc{color:var(--mute)}
  .meta .cry{color:var(--p2)} .meta .cry.hot{color:var(--over)}
  /* 検索 (2026-10-04): 🔍 でタブの代わりに検索欄を出す。全未完了を名前・説明で引く */
  .srch{display:flex;gap:8px;align-items:center}
  .srch input{flex:1;font-size:16px;padding:9px 14px;border-radius:12px;border:0;background:var(--card);color:var(--fg);box-shadow:var(--shadow);min-width:0}
  .srch label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute);white-space:nowrap}
  .srch button{height:34px;min-width:34px;border-radius:17px;border:0;background:var(--seg);color:var(--mute);font-size:16px}
  /* 📁 PJ別の見出し (Phase B-7/8, 2026-10-06): ゴール／完了条件／進捗バー。クローズ候補は黄、止まっている PJ は赤 */
  .pjh{padding:4px 10px 2px;display:flex;flex-direction:column;gap:6px}
  .pjh.cl{padding:10px 12px;border-radius:12px;background:#fff7e6;border:1px solid #f3dca8;gap:8px}
  :root[data-theme="dark"] .pjh.cl,:root:not([data-theme="light"]).sys-dark .pjh.cl{background:#3a2f12;border-color:#5a4a1e}
  .pjh .pt{display:flex;align-items:center;gap:8px}
  .pjh .pn{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pjh .pr{font-size:12px;color:var(--mute);flex:none}
  .pjh .bdg{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;flex:none}
  .pjh .bdg.cl{color:#8a5a00;background:#ffe6b3}
  .pjh .bdg.st{color:#b23b32;background:#fde7e5}
  .pjh .pg{font-size:12px;color:var(--mute);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pjh .pg.warn{color:var(--over);white-space:normal}
  .pjh .pb{display:flex;align-items:center;gap:8px}
  .pjh .bar{flex:1;height:6px;border-radius:3px;background:var(--sep);overflow:hidden}
  .pjh.cl .bar{background:#ead9b0}
  .pjh .bar i{display:block;height:100%;background:var(--acc)}
  .pjh .bar i.full{background:#34a853}
  .pjh .pc{font-size:12px;color:var(--mute);font-weight:600;flex:none}
  .pjh .pbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pjh .pbtn button{padding:11px;border:0;border-radius:10px;background:var(--card);color:var(--fg);font-size:14px;font-weight:600}
  .pjh .pbtn button.pri{background:var(--acc);color:#fff}
  .pjh .fn{font-size:11px;color:var(--mute)}
  .pjh .n{font-size:12px;font-weight:600;color:var(--mute);background:var(--seg);padding:0 7px;border-radius:9px;flex:none}
  .group button.addrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:transparent;color:var(--acc);font-size:15px;font-weight:600;text-align:left}
  .row+button.addrow{border-top:1px solid var(--line)}
  .add .pjchip{width:auto;height:auto;border:0;display:flex;align-items:center;gap:4px;max-width:40%;font-size:12px;font-weight:600;color:var(--acc);background:var(--accbg);padding:6px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .add .pjchip b{font-weight:400;color:var(--mute)}
  /* 🧭 役割タブ (Phase B-6): 編集はしない。見るのは ミッション・今週の石・PJ/今日の件数。書くのは 今週の石 だけ */
  .rsum{display:flex;justify-content:space-between;gap:8px;padding:0 10px;font-size:12px;color:var(--mute)}
  .rsum b{color:var(--today);font-weight:600}
  .rc{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
  .rc.dim{opacity:.6}
  .rc .rt{display:flex;align-items:baseline;gap:8px}
  .rc .rn{font-size:17px;font-weight:700}
  .rc .rk{font-size:12px;color:var(--mute);margin-left:auto;flex:none}
  .rc .rm{font-size:13px;color:var(--mute);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rc .rm .q2{color:var(--mute2)}
  .rc .rm.warn{color:var(--over)}
  .rc .rm a{color:inherit}
  .rc .stone{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:0;width:100%;text-align:left;color:var(--fg);font:inherit}
  .rc .stone .ring{width:20px;height:20px}
  .rc .stone .sb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .rc .stone .sl{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.3px}
  .rc .stone .sn{font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc .stone.done .sn{color:var(--mute2);text-decoration:line-through}
  .rc .stone .ss{font-size:12px;font-weight:600;flex:none}
  .rc .stone .ss.done{color:#34a853}.rc .stone .ss.doing{color:#0a84ff}.rc .stone .ss.todo{color:var(--mute)}
  .rc .stone.put{border:1.5px dashed var(--ring);background:transparent;color:var(--acc);font-size:15px;font-weight:600}
  .rc .stone.put small{margin-left:auto;font-size:12px;color:var(--mute);font-weight:400;white-space:nowrap}
  .rfoot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--sep)}
  .rfoot a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:var(--card);color:var(--fg);font-size:15px;font-weight:600;text-decoration:none;box-shadow:var(--shadow)}
  .sheet .pick{display:flex;flex-direction:column}
  .sheet .pick button{display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;background:transparent;color:var(--fg);font-size:15px;text-align:left;width:100%}
  .sheet .pick button+button{border-top:1px solid var(--line)}
  .sheet .pick button .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet .pick button small{color:var(--mute);font-size:12px;flex:none}
  .sheet .pick.pp button .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--ring);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
  .sheet .pick.pp button.on .ck{background:var(--acc);border-color:var(--acc);color:#fff}
  .sheet .pick.pp button.on .nm{color:var(--acc);font-weight:600}
  .pjh .bdg.un{color:#5b4bd6;background:#e9e6ff;border:0;cursor:pointer}
  /* 🗂 見直し (Phase C-9, 2026-10-06): 1 問 1 画面。機械的に決まる問いだけ。理由が要るものは Claude へ */
  .rvp{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12px;color:var(--mute)}
  .rvp .bar{flex:1;height:4px;border-radius:2px;background:var(--sep);overflow:hidden}.rvp .bar i{display:block;height:100%;background:var(--acc)}
  .rvc{background:var(--card);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:18px 16px 14px;display:flex;flex-direction:column;gap:14px}
  .rvc .rh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
  .rvc .db{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accbg);color:var(--acc)}
  .rvc .db.Tasks{background:#fde7e5;color:#b23b32}.rvc .db.Decisions{background:#ffe6b3;color:#8a5a00}
  .rvc .rq{font-size:19px;font-weight:700;line-height:1.35}
  .rvc .rb{font-size:14px;line-height:1.5;color:var(--fg);white-space:pre-wrap;max-height:9em;overflow:auto}
  .rvc .ctx{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:13px;color:var(--mute);line-height:1.45}
  .rvc .ctx b{font-weight:400;color:var(--mute2);margin-right:6px}
  .rvc .opts{display:flex;flex-direction:column;gap:8px}
  .rvc .opts button{padding:13px 14px;border:0;border-radius:12px;background:var(--bg);color:var(--fg);font-size:16px;font-weight:600;text-align:left;display:flex;align-items:center;gap:10px}
  .rvc .opts button.pri{background:var(--acc);color:#fff}
  .rvc .opts button .no{width:22px;height:22px;border-radius:50%;border:2px solid var(--ring);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mute);flex:none}
  .rvc .opts button.pri .no{border-color:rgba(255,255,255,.7);color:#fff}
  .rvc .opts button small{margin-left:auto;font-size:12px;font-weight:400;color:var(--mute);text-align:right}
  .rvc .opts button.pri small{color:rgba(255,255,255,.85)}
  .rvc .rnote{font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
  .rvc .rcl{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;font-size:14px;font-weight:600;color:var(--acc);text-decoration:none}
  .rvn h2{margin:0 0 6px;padding:0 10px;font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
  .rvn .group>div{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:14px}.rvn .group>div+div{border-top:1px solid var(--line)}
  .rvn .group>div span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 🔗 つながり (Phase C-11, 2026-10-06): 幅 700px 以上はガント、未満は依存順タイムライン。矛盾 (後続の期日 < 先行の期日) は赤 */
  .dh{display:flex;align-items:center;gap:10px;padding:0 4px}
  .dh button{width:32px;height:32px;border-radius:16px;border:0;background:var(--seg);color:var(--fg);font-size:18px;flex:none}
  .dh .dt{flex:1;min-width:0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dwarn{padding:8px 10px;border-radius:10px;background:#fde7e5;color:#b23b32;font-size:12px;line-height:1.4}
  :root[data-theme="dark"] .dwarn,:root:not([data-theme="light"]).sys-dark .dwarn{background:#4a1f1c;color:#ff8a80}
  .dwrap{display:flex;background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}

    const dn = $("#doneNote"); if (dn) dn.onkeydown = (e) => {
      if (imeEnter(e)) return; // 日本語変換の確定 Enter では完了しない (2026-10-06)
      if (e.key === "Enter") { e.preventDefault(); const b = $("#sheet").querySelector('button[data-a="done"]'); if (b && !b.disabled) b.click(); }
      else if (e.key === "Escape") { e.stopPropagation(); dn.value = ""; }
    };
    // 先行タスクのチェーンを引いて、順に並べる。各行に完了ボタン (人が自分で順送りする用) と Notion リンク
    if (t.blocked || t.predIds.length) {
      api(`/api/tasks/${t.id}/chain`).then((j) => {
        const box = $("#chainBox"); if (!box) return;
        if (!j.chain.length) { // 式の再計算待ちで blocked のまま見えているだけ。操作を戻す
          box.innerHTML = `<div class="ch"><span class="nm" style="color:var(--mute)">先行はすべて完了。着手できます</span></div>`;
          $("#sheet").querySelectorAll("button[data-a]").forEach((b) => b.disabled = false);
          $("#sheet").querySelectorAll(".list").forEach((l) => { l.style.opacity = ""; l.style.pointerEvents = ""; });
          return;
        }
        box.innerHTML = j.chain.map((c, i) => `<div class="ch" data-cid="${c.id}">
            <span class="no">${i + 1}</span>
            <button class="ring" aria-label="${esc(c.name)} を完了" data-cdone="${c.id}"></button>
            <span class="nm">${c.icon ? c.icon + " " : ""}${esc(c.name)}<small>${c.due ? fmtDate(c.due) + " · " : ""}${c.env.join("・") || "—"}</small></span>
            <a href="${c.url}" target="_blank" rel="noopener">開く</a></div>`).join("") +
          (j.cycle ? `<div class="ch"><span class="nm" style="color:var(--over)">⚠️ 先行が循環しています。Notion で直してください</span></div>` : "") +
          (j.truncated ? `<div class="ch"><span class="nm" style="color:var(--over)">⚠️ 先行が深すぎます（10段まで）</span></div>` : "");
        $("#claudeRun").href = aiHref(t, "run", j.chain);
        $("#claudeRunLabel").textContent = `Claude に先行から順に進めてもらう（${j.chain.length} 件先）`;
        box.querySelectorAll("[data-cdone]").forEach((b) => b.onclick = async () => {
          const cid = b.dataset.cdone; const c = j.chain.find((x) => x.id === cid);
          b.classList.add("on"); b.innerHTML = ICONS.check;
          try { await api(`/api/tasks/${cid}/done`, { method: "POST" }); toast(`完了: ${c.name}`, () => api(`/api/tasks/${cid}/reopen`, { method: "POST" })); }
          catch (e) { toast("失敗: " + e.message); }
          setTimeout(() => openSheet(t, today), 800); // 残りのチェーンを引き直す
          load(view, { silent: true });
        });
      }).catch(() => { const box = $("#chainBox"); if (box) box.innerHTML = `<div class="ch"><span class="nm" style="color:var(--over)">先行を取得できませんでした</span></div>`; });
    }
    // 開始日はネイティブのカレンダー UI (input type=date) で選ぶ。Android Chrome ではカレンダーが出る
    $("#pickStart").onclick = (e) => {
      e.preventDefault();
      const row = $("#dpRow"), dp = $("#datePick");
      if (!dp.value) dp.value = t.start || today || "";
      dp.min = today || "";
      row.hidden = false; row.scrollIntoView({ block: "nearest" });
      const commit = async () => {
        const d = dp.value; if (!d) return;
        closeSheet();
        try {
          const j = await api(`/api/tasks/${t.id}/start?date=${d}`, { method: "POST" });
          toast(`開始日 ${fmtDate(d)}: ${t.name}` + (j.task.due === d && t.due !== d ? "（期日も揃えた）" : ""));
          load(view, { silent: true }); counts();
        } catch (err) { toast("失敗: " + err.message); }
      };
      $("#dpOk").onclick = commit;
      dp.onkeydown = (ev) => { if (ev.key === "Enter") commit(); };
      // Android Chrome はカレンダーがそのまま出る。Mac は入力欄が見えているので showPicker が画面内に出る（画面外の input に出していたのが 2026-09-30 の不具合）
      if (typeof dp.showPicker === "function") { try { dp.showPicker(); } catch (_) { dp.focus(); } } else dp.focus();
    };
  }
  // 後続を先に完了したとき、残っている先行をどうするか (2026-09-29 決定: その場で聞く)
  function askPending(t, preds) {
    const names = preds.map((p) => (p.icon ? p.icon + " " : "") + esc(p.name)).join("、");
    sheetStep = null; // 問いのシートでは ←→ を無効に
    $("#sheet").innerHTML = `
      <div class="grab"></div>
      <div class="head"><h3>先行タスクが未完了のままです</h3><button class="close" id="sheetClose" aria-label="閉じる"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="sub">「${esc(t.name)}」を完了しました。先行: ${names}</div>
      <div class="grid">
        <button data-p="done"><span class="ring done-ring">${ICONS.check}</span>一緒に完了</button>
        <button data-p="skip">${ICONS.skip}見送りで完了</button>
        <button data-p="keep" style="grid-column:1/-1">そのまま残す</button>
      </div>`;
    $("#sheetWrap").hidden = false; $("#sheet").style.transform = "";
    if (!history.state || !history.state.sheet) history.pushState({ sheet: true }, "");
    $("#sheetClose").onclick = closeSheet;
    $("#sheet").querySelectorAll("button[data-p]").forEach((b) => b.onclick = async () => {
      const a = b.dataset.p; closeSheet();
      if (a === "keep") return;
      try { await Promise.all(preds.map((p) => api(`/api/tasks/${p.id}/${a}`, { method: "POST" }))); toast(`${a === "skip" ? "見送り" : "完了"}: ${preds.map((p) => p.name).join("、")}`); }
      catch (e) { toast("失敗: " + e.message); }
      load(view, { silent: true }); counts();
    });
  }
  let sheetStep = null; // openSheet が差し替える。タスクシートでない (add-sheet 等) ときは null
  let sheetTask = null; // いま開いているタスク (一覧に無いタスク — つながり・追加直後 — からも先行を選べるように, 2026-10-07)
  document.addEventListener("click", (e) => {
    const a = e.target.closest("#sheet [data-deps]"); if (a) { e.preventDefault(); openDeps(a.dataset.deps); return; }
    const g = e.target.closest("#sheet [data-graph]"); if (g) { e.preventDefault(); openGraph(g.dataset.graph); return; }
    const pp = e.target.closest("#sheet [data-pjpick]"); if (pp) { e.preventDefault(); const t = tasks.find((x) => x.id === pp.dataset.pjpick); if (t) openPjPick(t); }
    const pr = e.target.closest("#sheet [data-predpick]"); if (pr) { e.preventDefault(); const t = tasks.find((x) => x.id === pr.dataset.predpick) || sheetTask; if (t) openPredPick(t); }
  });
  function closeSheet() {
    if ($("#sheetWrap").hidden) return;
    $("#sheetWrap").hidden = true; sheetStep = null;
    if (history.state && history.state.sheet) history.back(); // 積んだ履歴を戻す (popstate は hidden 済みなので何もしない)
  }
  // Mac では ←→ で前後のタスクへ、Esc で閉じる (2026-10-04)
  document.addEventListener("keydown", (e) => {
    if ($("#sheetWrap").hidden || e.target.matches("input,textarea")) return;
    if (e.key === "Escape") closeSheet();
    else if (sheetStep && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); sheetStep(e.key === "ArrowLeft" ? -1 : 1); }
  });
  window.addEventListener("popstate", () => { if (!$("#sheetWrap").hidden) $("#sheetWrap").hidden = true; });
  $("#veil").onclick = closeSheet;
  // シートを下にスワイプで閉じる
  let shY = 0, shDy = 0, shOn = false;
  /* シートが縦にスクロールする場合、引き下げて閉じるのは一番上にいるときだけ（2026-09-30） */
  $("#sheet").addEventListener("touchstart", (e) => { shY = e.touches[0].clientY; shDy = 0; shOn = $("#sheet").scrollTop <= 0; }, { passive: true });
  $("#sheet").addEventListener("touchmove", (e) => { if (!shOn) return; if ($("#sheet").scrollTop > 0) { shOn = false; $("#sheet").style.transform = ""; return; } shDy = Math.max(0, e.touches[0].clientY - shY); $("#sheet").style.transform = `translateY(${shDy}px)`; }, { passive: true });
  $("#sheet").addEventListener("touchend", () => { if (!shOn) return; shOn = false; if (shDy > 80) closeSheet(); else $("#sheet").style.transform = ""; });

  // タップ → メニュー、🤖 → Claude、スワイプ → 完了/明日へ
  let sx = 0, sy = 0, card = null, dx = 0, swiping = false, todayStr = "";
  $("#list").addEventListener("touchstart", (e) => { card = e.target.closest(".card"); if (!card) return; if (card.parentElement.classList.contains("blocked") || card.parentElement.classList.contains("dn")) { card = null; return; } /* 先行待ち・完了済み (検索) はスワイプ不可 */ sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; swiping = false; }, { passive: true });
  $("#list").addEventListener("touchmove", (e) => {
    if (!card) return; dx = e.touches[0].clientX - sx; const dy = e.touches[0].clientY - sy;
    if (!swiping && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) swiping = true;
    if (swiping) { card.style.transform = `translateX(${dx}px)`; card.parentElement.querySelector(".under").style.background = dx > 0 ? "#7c5cff" : "#e0a100"; }
  }, { passive: true });
  $("#list").addEventListener("touchend", () => {
    if (!card) return; const c = card; card = null;
    const t = tasks.find((x) => x.id === c.parentElement.dataset.id);
    // 右スワイプ＝🤖 Claude に進めてもらう (2026-10-01。完了は丸タップで足りるので、右は実行に割り当て直した)。左＝明日へ
    if (swiping && dx > 90 && t) { c.style.transform = ""; goClaude(t, aiHref(t, "run")); }
    else if (swiping && dx < -90 && t) { c.style.transform = `translateX(-500px)`; setTimeout(() => act(t, "defer?days=1", "明日へ"), 120); }
    else c.style.transform = "";
    setTimeout(() => { swiping = false; }, 50);
  });
  // ---- Phase B (2026-10-06): PJ 見出し・役割カードの操作 ----
  function setAddProject(p) {
    addProject = p; const c = $("#addPj");
    if (p) { c.hidden = false; c.innerHTML = `📁 ${esc(p.label.replace(/^\S+\s/, ""))} <b>✕</b>`; $("#addName").placeholder = "この PJ の次のアクションを1件"; $("#addName").focus(); }
    else { c.hidden = true; $("#addName").placeholder = "タイトルだけで追加"; }
  }
  $("#addPj").onclick = () => setAddProject(null);
  async function closeProject(id, name) {
    const note = prompt(`「${name}」をクローズします。結論を1行（空でも可）`, "");
    if (note === null) return;
    try {
      const j = await api(`/api/projects/${id}/close`, { method: "POST", body: JSON.stringify({ note }) });
      toast(`クローズ: ${j.project.name}（Decisions に決着行）`);
      projInfoAt = 0; localStorage.removeItem(K("project")); load("project", { silent: true });
    } catch (e) { toast("クローズ失敗: " + e.message); }
  }
  // 今週の石を選ぶシート: その役割の PJ に属する未完了 (期日順 10 件)。候補に無ければ Claude へ
  function openPickSheet(r) {
    const items = (r.candidates || []).map((c) => `<button data-pick="${c.id}"><span class="nm">${c.icon ? c.icon + " " : ""}${esc(c.name)}</span><small>${c.due ? fmtDate(c.due) : (c.project ? esc(c.project).slice(0, 12) : "")}</small></button>`).join("");
    $("#sheet").innerHTML = `<div class="grab"></div><div class="head"><h3>${r.icon ? r.icon + " " : ""}${esc(r.name)} — 今週の石を置く</h3><button class="close" aria-label="閉じる">✕</button></div>
      <div class="sub">予定に入れないと起きないもの。この役割の PJ の未完了から 1 つ</div>
      <div class="list pick">${items || '<button disabled><span class="nm" style="color:var(--mute)">候補なし（この役割の PJ に未完了タスクがありません）</span></button>'}</div>
      <a class="notion" href="${claudeLink(`役割「${r.name}」の今週の石（今週の目標）を一問一答で決めたいです。Notion 🧭 Roles のページ: ${r.url} 。候補を 3 つ出して 1 つに絞り、✅ Tasks に無ければ起票して、今週の目標 に「〜M/D：<タスク名> → Tasks <page_id>」の書式で書いてください。`)}" data-ext>${ICONS.claude} Claude と相談して決める</a>`;
    $("#sheetWrap").hidden = false; $("#sheet").style.transform = ""; $("#sheet").scrollTop = 0; sheetStep = null; if (!history.state || !history.state.sheet) history.pushState({ sheet: true }, "");
    $("#sheet").querySelector(".close").onclick = closeSheet;
    $("#sheet").querySelectorAll("[data-pick]").forEach((b) => b.onclick = async () => {
      closeSheet();
      try { await api(`/api/roles/${r.id}/goal`, { method: "POST", body: JSON.stringify({ taskId: b.dataset.pick }) }); toast(`今週の石: ${b.querySelector(".nm").textContent}`); load("roles", { silent: true }); }
      catch (e) { toast("失敗: " + e.message); }
    });
  }
  function openStoneSheet(r) {
    const st = r.stone; const t = st.taskId ? { id: st.taskId, name: st.name, url: st.url || ("https://www.notion.so/" + st.taskId.replace(/-/g, "")) } : null;
    $("#sheet").innerHTML = `<div class="grab"></div><div class="head"><h3>${st.icon ? st.icon + " " : ""}${esc(st.name)}</h3><button class="close" aria-label="閉じる">✕</button></div>
      <div class="sub">${esc(r.name)} の今週の石${st.until ? `（〜${esc(st.until)}）` : ""}${st.due ? ` · 期日 ${fmtDate(st.due)}` : ""}</div>
      <div class="list">${t ? `<a href="${aiHref(t, "run")}" data-stoneai><span class="ic">${ICONS.claude}</span>🤖 Claude に進めてもらう</a><a href="${t.url}" target="_blank" rel="noopener"><span class="ic">📄</span>Notion で開く</a>` : ""}
        <a href="#" data-repick><span class="ic">${ICONS.pen}</span>別のタスクに置き換える</a><a href="#" data-unstone style="color:var(--mute)"><span class="ic">${ICONS.skip}</span>石を外す</a></div>`;
    $("#sheetWrap").hidden = false; $("#sheet").style.transform = ""; $("#sheet").scrollTop = 0; sheetStep = null; if (!history.state || !history.state.sheet) history.pushState({ sheet: true }, "");
    $("#sheet").querySelector(".close").onclick = closeSheet;
    $("#sheet").querySelector("[data-repick]").onclick = (e) => { e.preventDefault(); closeSheet(); setTimeout(() => openPickSheet(r), 200); };
    $("#sheet").querySelector("[data-unstone]").onclick = async (e) => { e.preventDefault(); closeSheet(); try { await api(`/api/roles/${r.id}/goal`, { method: "POST", body: JSON.stringify({}) }); toast("石を外した: " + r.name); load("roles", { silent: true }); } catch (err) { toast("失敗: " + err.message); } };
    const ai = $("#sheet").querySelector("[data-stoneai]"); if (ai) ai.onclick = () => { closeSheet(); fetch(`/api/tasks/${t.id}/ai?mode=run`, { method: "POST", keepalive: true }).catch(() => {}); };
  }
  $("#list").addEventListener("click", (e) => {
    if (swiping) return;
    const pc = e.target.closest("[data-pjclose]"); if (pc) { closeProject(pc.dataset.pjclose, pc.dataset.pjname); return; }
    const pd = e.target.closest("[data-pjdeps]"); if (pd) { openDeps(pd.dataset.pjdeps); return; }
    if (e.target.closest("[data-quad]")) { e.preventDefault(); openQuad(); return; }
    if (view === "graph") {
      if (e.target.closest("[data-dback]")) { graphData = null; load(depsBack); return; }
      const gd = e.target.closest("[data-gdeps]"); if (gd) { openDeps(gd.dataset.gdeps); return; }
      if (e.target.closest("a")) return;
      const nd = e.target.closest("[data-gid]"); if (nd) { const t = tasks.find((x) => x.id === nd.dataset.gid); if (t) { if (t.id === graphData.task.id) openSheet(t, todayStr); else openGraph(t.id); } }
      return;
    }
    if (view === "quad") {
      if (e.target.closest("[data-dback]")) { load(depsBack); return; }
      const qi = e.target.closest("[data-qid]"); if (qi) { const t = tasks.find((x) => x.id === qi.dataset.qid); if (t) openSheet(t, todayStr); }
      return;
    }
    if (view === "deps") {
      if (e.target.closest("[data-dback]")) { closeDeps(); return; }
      if (e.target.closest("[data-dtoggle]")) { depsShowDone = !depsShowDone; render(todayStr); return; }
      const fx = e.target.closest("[data-fix]"); if (fx) { fixConflict(fx.dataset.fix, fx.dataset.date); return; }
      if (e.target.closest("a")) return;
      const nm = e.target.closest("[data-did]"); const t = nm && tasks.find((x) => x.id === nm.dataset.did); if (t) openSheet(t, todayStr);
      return;
    }
    const pa = e.target.closest("[data-pjadd]"); if (pa) { setAddProject({ id: pa.dataset.pjadd, label: pa.dataset.pjlabel }); return; }
    if (view === "review") {
      if (e.target.closest("[data-ext]") || e.target.closest("a")) return;
      const b = e.target.closest("[data-ans]"); if (!b) return;
      const card = b.closest(".rvc"); const q = reviewList()[0];
      if (q && card && card.dataset.qid === q.id) reviewAnswer(q, b.dataset.ans);
      return;
    }
    if (view === "roles") {
      if (e.target.closest("[data-ext]")) return; // Claude へのリンクはそのまま
      const rc = e.target.closest("[data-role]"); const r = rc && rolesData && rolesData.roles.find((x) => x.id === rc.dataset.role); if (!r) return;
      if (e.target.closest("[data-rolepick]")) openPickSheet(r);
      else if (e.target.closest("[data-rolestone]")) openStoneSheet(r);
      else if (e.target.closest("[data-rolepj]")) { if (rolePjOpen.has(r.id)) rolePjOpen.delete(r.id); else rolePjOpen.add(r.id); rc.querySelector(".rpj").classList.toggle("open", rolePjOpen.has(r.id)); }
      else if (e.target.closest("[data-rpj]")) { const b = e.target.closest("[data-rpj]"); const p = (r.projects || []).find((x) => x.id === b.dataset.rpj); if (p && p.open > 1) openDeps(p.id); else { load("project"); } }
      return;
    }
    const row = e.target.closest(".row"); if (!row) return;
    const t = tasks.find((x) => x.id === row.dataset.id); if (!t) return;
    if (e.target.closest("[data-sess]")) return; // 処理中のセッションを開くリンク。シートは開かない
    if (e.target.closest("[data-claude]")) { if (t.blocked) { openSheet(t, todayStr); return; } goClaude(t, aiHref(t, "run")); return; } // 先行待ちはチェーン込みで投げたいのでメニューへ
    const ring = e.target.closest("[data-done]");
    if (ring) { // 丸をタップ＝完了 (青く塗ってから消す)
      if (t.aiActive && !confirm("Claude が処理中です。それでも完了にしますか？")) return;
      ring.classList.add("on"); ring.innerHTML = ICONS.check;
      setTimeout(() => act(t, "done", "完了"), 180);
      return;
    }
    openSheet(t, todayStr);
  });
  const _render = render; render = (today) => { todayStr = today; _render(today); };
  $("#tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) load(b.dataset.v); };
  // 検索 (2026-10-04): 🔍 で検索欄を出し、入力が止まって 350ms で引く。✕ か空 Esc で元のタブへ
  function openSearch() {
    if (view !== "search") { searchBack = view; view = "search"; }
    tasks = []; render(todayStr); $("#srchQ").focus();
    if (searchQ.trim()) load("search");
  }
  function closeSearch() { if (view !== "search") return; searchQ = ""; $("#srchQ").value = ""; load(searchBack); }
  $("#srchBtn").onclick = () => view === "search" ? closeSearch() : openSearch();
  $("#srchClose").onclick = closeSearch;
  let srchTimer = null;
  $("#srchQ").addEventListener("input", () => { searchQ = $("#srchQ").value; clearTimeout(srchTimer); srchTimer = setTimeout(() => load("search"), 350); });
  $("#srchQ").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); closeSearch(); } });
  $("#srch").onsubmit = (e) => { e.preventDefault(); clearTimeout(srchTimer); searchQ = $("#srchQ").value; load("search"); $("#srchQ").blur(); };
  $("#srchAll").onchange = () => { searchAll = $("#srchAll").checked; load("search"); };
  document.addEventListener("keydown", (e) => { // Mac: ⌘F / Ctrl+F で検索
    if ((e.metaKey || e.ctrlKey) && e.key === "f" && $("#sheetWrap").hidden) { e.preventDefault(); openSearch(); }
  });
  $("#add").onsubmit = async (e) => {
    e.preventDefault(); const name = $("#addName").value.trim(); if (!name) return; $("#addName").value = "";
    const pj = addProject; // PJ別の「この PJ にタスクを足す」から来たときは紐づける (Phase B)
    try {
      const j = await api("/api/tasks", { method: "POST", body: JSON.stringify({ name, ...(pj ? { projectId: pj.id } : {}) }) });
      // PJ に他の未完了があれば、その場で先行を選べるボタンを出す (2026-10-07, 依存の洗い出し D)
      const pjInfo = pj && (projInfo || []).find((p) => p.id === pj.id);
      if (pj && pjInfo && pjInfo.open > 0) toast(`追加: ${j.task.name} → ${j.task.project || pjInfo.label}`, () => openPredPick(j.task), "先行を選ぶ");
      else toast("追加: " + j.task.name + (j.task.project ? ` → ${j.task.project}` : ""));
      if (pj) { setAddProject(null); projInfoAt = 0; } load(view, { silent: true });
    }
    catch (err) { toast("追加失敗: " + err.message); $("#addName").value = name; }
  };

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  load(view).then(counts);
})();
</script>
</body>
</html>
