# main への push で Cloudflare Workers へデプロイする。
# Secrets:   CLOUDFLARE_API_TOKEN（Workers 編集権限だけ）, CLOUDFLARE_ACCOUNT_ID
# Variables: TASKS_DATA_SOURCE_ID, PROJECTS_DATA_SOURCE_ID, ROLES_DATA_SOURCE_ID, DECISIONS_DATA_SOURCE_ID,
#            HABITS_DATA_SOURCE_ID, HABIT_LOG_DATA_SOURCE_ID（Notion のデータソース ID。秘密ではないが公開リポジトリには置かない）
# Worker 自身の秘密（NOTION_TOKEN / APP_TOKEN）は wrangler secret に入っていて、ここでは触らない。
name: deploy
on:
  push:
    branches: [main]
    paths: ["src/**", "wrangler.toml", "package.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 構文検査（ESM は .mjs に写して）
        run: |
          cp src/index.js /tmp/chk.mjs && node --check /tmp/chk.mjs
          python3 - <<'PY'
          import re; h=open('src/app.html').read(); open('/tmp/app_chk.js','w').write('\n'.join(re.findall(r'<script>(.*?)</script>', h, re.S)))
          PY
          node --check /tmp/app_chk.js
      - name: トークンの有無
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN が未設定なのでデプロイを飛ばす"; echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: wrangler deploy
        if: steps.gate.outputs.go == '1'
        run: |
          npm ci
          npx wrangler deploy \
            --var TASKS_DATA_SOURCE_ID:"${{ vars.TASKS_DATA_SOURCE_ID }}" \
            --var PROJECTS_DATA_SOURCE_ID:"${{ vars.PROJECTS_DATA_SOURCE_ID }}" \
            --var ROLES_DATA_SOURCE_ID:"${{ vars.ROLES_DATA_SOURCE_ID }}" \
            --var DECISIONS_DATA_SOURCE_ID:"${{ vars.DECISIONS_DATA_SOURCE_ID }}" \
            --var HABITS_DATA_SOURCE_ID:"${{ vars.HABITS_DATA_SOURCE_ID }}" \
            --var HABIT_LOG_DATA_SOURCE_ID:"${{ vars.HABIT_LOG_DATA_SOURCE_ID }}"
      - name: 反映の確認
        if: steps.gate.outputs.go == '1' && vars.PUBLIC_URL != ''
        run: |
          sleep 10
          v=$(curl -s "${{ vars.PUBLIC_URL }}/sw.js" | grep -o 'kairos-v[0-9]*' || true)
          echo "live: $v / repo: $(grep -o 'kairos-v[0-9]*' src/sw.txt)"
